ially-fewer-cybercrimes-in-2025-due-to-intensified-cyberpatrols-awareness/story/\" target=\"_blank\" rel=\"noopener\">PNP, 2025<\/a><\/div>\n    <div><span>Survey says<\/span><b>Reporting is complex.<\/b><a href=\"https://businessmirror.com.ph/2024/11/12/67-of-filipinos-still-dont-report-scams-to-authorities-gasa-study/\" target=\"_blank\" rel=\"noopener\">Global Anti-Scam Alliance, 2024<\/a><\/div>\n  <\/div><\/section>\n\n<section class=\"sc\" id=\"s5\"><div><span class=\"kick\">5 · Redress<\/span><div class=\"big hi\" id=\"tRate\"><\/div><p class=\"line\">mediation success.<\/p><small class=\"src\" id=\"srcRate\"><\/small><\/div>\n  <div><div class=\"rate\"><div><b id=\"tR24\"><\/b><span>2024<\/span><\/div><div><b id=\"tR25\"><\/b><span>2025<\/span><\/div><div><b id=\"tStrict\"><\/b><span>counting terminated<\/span><\/div><\/div>\n  <div class=\"viz-title\">Mediation · 1,188 cases<\/div><div id=\"vMed\"><\/div><div class=\"viz-title gap2\">Adjudication · 68 cases<\/div><div id=\"vAdj\"><\/div><\/div><\/section>\n\n<section class=\"sc end\" id=\"s6\">\n  <h2>Reports up. <span>Records down.<\/span><\/h2>\n  <div class=\"end-grid\">\n    <div><div class=\"viz-title\">2024 → 2025, indexed to 2024 = 100<\/div><div id=\"vGap\"><\/div><\/div>\n    <div><small class=\"src\" style=\"margin:0 0 16px\">Three separate counts, not one pipeline. BSP covers complaints against supervised institutions.<\/small>\n      <details><summary class=\"btn\">All 50 records<\/summary><div id=\"vData\"><\/div><\/details><\/div>\n  <\/div>\n<\/section>\n\n<script>window.SCAM_ROWS=[{\"observation_id\": \"cicc.complaints.2023\", \"measure\": \"CICC cybercrime complaints received\", \"numeric_value\": \"3317\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"complaints\", \"period\": \"2023\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Cybercrime In \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.handled.2025\", \"measure\": \"Adjudication cases handled, including carryovers\", \"numeric_value\": \"68\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Includes 12 cases carried over from 2024.\"}, {\"observation_id\": \"bsp.adjudication.carryover.2025\", \"measure\": \"Adjudication cases carried over from 2024\", \"numeric_value\": \"12\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"carried into 2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.new.2025\", \"measure\": \"New adjudication cases\", \"numeric_value\": \"56\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"derived\", \"is_derived\": \"true\", \"derivation_inputs\": \"bsp.adjudication.handled.2025 bsp.adjudication.carryover.2025\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"The BSP published the total handled and the carryover but not the new-case count.\"}, {\"observation_id\": \"bsp.adjudication.decided.2025\", \"measure\": \"Adjudication cases decided\", \"numeric_value\": \"11\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Decided\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.dismissed.2025\", \"measure\": \"Adjudication cases dismissed\", \"numeric_value\": \"20\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Dismissed\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.pending.2025\", \"measure\": \"Adjudication cases pending at year end\", \"numeric_value\": \"37\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"31 Dec 2025\", \"geography\": \"Philippines\", \"category\": \"Pending\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.open.2025\", \"measure\": \"Mediation cases still open at year end\", \"numeric_value\": \"312\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"31 Dec 2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"derived\", \"is_derived\": \"true\", \"derivation_inputs\": \"bsp.mediation.handled.2025 bsp.mediation.completed.2025\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Not published directly. It is the remainder of the handled caseload after the completed cases, and it is excluded from the published success rate.\"}];\n<\/script><script>/* Chart + data helpers shared by the three options. All figures come from data.js (generated from the CSV). */\n(function () {\n  const rows = window.SCAM_ROWS;\n  const by = Object.fromEntries(rows.map(r => [r.observation_id, r]));\n  const V = id => { if (!by[id]) throw new Error('Unknown id ' + id); return Number(by[id].numeric_value); };\n  const fmt = n => Math.round(n).toLocaleString('en-PH');\n  const pct = (from, to, d = 1) => { const p = (to / from - 1) * 100; return (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(d) + '%'; };\n  const peso = (n, d = 1) => '₱' + (n / 1e6).toFixed(d) + 'M';\n  const esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n  const named = ['gcash', 'bpi', 'gotyme', 'maya'].reduce((s, k) => s + V(`cicc.losses.${k}.2024`), 0);\n  const pnp = ['onlineselling', 'investment', 'hijacked', 'vishing'];\n  const D = {\n    mult: V('cicc.complaints.2025') / V('cicc.complaints.2023'),\n    fraud: V('cicc.consumerfraud.2025') + V('cicc.onlinefraud.2025'),\n    fraudShare: (V('cicc.consumerfraud.2025') + V('cicc.onlinefraud.2025')) / V('cicc.complaints.2025') * 100,\n    unattributed: V('cicc.losses.2024') - named,\n    pnp24: pnp.reduce((s, k) => s + V(`pnp.${k}.2024`), 0),\n    pnp25: pnp.reduce((s, k) => s + V(`pnp.${k}.2025`), 0),\n    strictRate: V('bsp.mediation.successful.2025') / V('bsp.mediation.completed.2025') * 100,\n  };\n\n  /* Re-renders on width change; animates on first paint only. */\n  function mount(el, draw) {\n    if (el._ro) el._ro.disconnect();\n    let last = 0;\n    const paint = first => {\n      const w = el.clientWidth; if (!w || w === last) return; last = w;\n      el.innerHTML = draw(w); el.classList.toggle('vz-anim', !!first);\n    };\n    paint(true);\n    el._ro = new ResizeObserver(() => paint(false)); el._ro.observe(el);\n  }\n\n  const barPath = (x, y, w, h, r = 4) => {\n    w = Math.max(w, 1); r = Math.min(r, w, h / 2);\n    return `M${x} ${y}h${w - r}a${r} ${r} 0 0 1 ${r} ${r}v${h - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${r - w}z`;\n  };\n  const colPath = (x, y, w, h, r = 4) => {\n    h = Math.max(h, 1); r = Math.min(r, h, w / 2);\n    return `M${x} ${y + h}v${r - h}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${h - r}z`;\n  };\n\n  /* rows: {label, value, text, hi, tip} */\n  function hbars(el, o) {\n    const rowH = o.rowH || 34, barH = o.barH || 16, H = o.rows.length * rowH;\n    const max = o.max || Math.max(...o.rows.map(r => r.value));\n    mount(el, w => {\n      const lw = o.labelW || Math.min(150, w * .36), vw = o.valueW || 86, pw = Math.max(40, w - lw - vw - 8);\n      const g = o.rows.map((r, i) => {\n        const y = i * rowH, by = y + (rowH - barH) / 2, bw = r.value / max * pw;\n        return `<g data-tip=\"${esc(r.tip || r.label + ': ' + r.text)}\"><rect x=\"0\" y=\"${y}\" width=\"${w}\" height=\"${rowH}\" fill=\"transparent\"/>\n          <text class=\"vz-l${r.hi ? ' vz-strong' : ''}\" x=\"${lw - 10}\" y=\"${y + rowH / 2}\" text-anchor=\"end\" dominant-baseline=\"central\">${esc(r.label)}<\/text>\n          <path class=\"vz-gx\" style=\"--d:${i * 60}ms;fill:${r.hi ? 'var(--mark-hi)' : 'var(--mark)'}\" d=\"${barPath(lw, by, bw, barH)}\"/>\n          <text class=\"vz-v${r.hi ? ' vz-strong' : ''}\" x=\"${lw + bw + 8}\" y=\"${y + rowH / 2}\" dominant-baseline=\"central\">${esc(r.text)}<\/text><\/g>`;\n      }).join('');\n      return `<svg role=\"img\" aria-label=\"${esc(o.alt)}\" width=\"${w}\" height=\"${H}\" viewBox=\"0 0 ${w} ${H}\">${g}<\/svg>`;\n    });\n  }\n\n  /* rows: {label, value, text, hi} */\n  function columns(el, o) {\n    const H = o.h || 200, top = 28, bot = 26, ph = H - top - bot, bm = o.barMax || 44;\n    const max = Math.max(...o.rows.map(r => r.value));\n    mount(el, w => {\n      const band = w / o.rows.length, bw = Math.min(bm, band * .55);\n      const g = o.rows.map((r, i) => {\n        const h = r.value / max * ph, x = band * i + (band - bw) / 2, y = top + ph - h;\n        return `<g data-tip=\"${esc(r.label + ': ' + r.text)}\"><rect x=\"${band * i}\" y=\"0\" width=\"${band}\" height=\"${H}\" fill=\"transparent\"/>\n          <path class=\"vz-gy\" style=\"--d:${i * 90}ms;fill:${r.hi ? 'var(--mark-hi)' : 'var(--mark)'}\" d=\"${colPath(x, y, bw, h)}\"/>\n          <text class=\"vz-v${r.hi ? ' vz-strong' : ''}\" x=\"${x + bw / 2}\" y=\"${y - 8}\" text-anchor=\"middle\">${esc(r.text)}<\/text>\n          <text class=\"vz-l\" x=\"${x + bw / 2}\" y=\"${H - 6}\" text-anchor=\"middle\">${esc(r.label)}<\/text><\/g>`;\n      }).join('');\n      return `<svg role=\"img\" aria-label=\"${esc(o.alt)}\" width=\"${w}\" height=\"${H}\" viewBox=\"0 0 ${w} ${H}\"><line class=\"vz-axis\" x1=\"0\" x2=\"${w}\" y1=\"${top + ph + .5}\" y2=\"${top + ph + .5}\"/>${g}<\/svg>`;\n    });\n  }\n\n  /* rows: {label, a, b, text}: a = earlier value, b = later value */\n  function dumbbell(el, o) {\n    const rowH = o.rowH || 38, head = 26, H = o.rows.length * rowH + head;\n    const max = Math.max(...o.rows.map(r => Math.max(r.a, r.b)));\n    mount(el, w => {\n      const lw = o.labelW || Math.min(150, w * .34), vw = o.valueW || 118, pw = Math.max(60, w - lw - vw - 16);\n      const g = o.rows.map((r, i) => {\n        const y = head + i * rowH + rowH / 2, xa = lw + r.a / max * pw, xb = lw + r.b / max * pw;\n        return `<g data-tip=\"${esc(`${r.label}: ${fmt(r.a)} → ${fmt(r.b)} (${r.text})`)}\"><rect x=\"0\" y=\"${y - rowH / 2}\" width=\"${w}\" height=\"${rowH}\" fill=\"transparent\"/>\n          <text class=\"vz-l\" x=\"${lw - 12}\" y=\"${y}\" text-anchor=\"end\" dominant-baseline=\"central\">${esc(r.label)}<\/text>\n          <line class=\"vz-conn\" x1=\"${xa}\" x2=\"${xb}\" y1=\"${y}\" y2=\"${y}\"/>\n          <circle cx=\"${xa}\" cy=\"${y}\" r=\"5\" style=\"fill:var(--mark)\" class=\"vz-dot\"/>\n          <circle cx=\"${xb}\" cy=\"${y}\" r=\"6\" style=\"fill:var(--mark-hi)\" class=\"vz-dot\"/>\n          <text class=\"vz-v vz-strong\" x=\"${w}\" y=\"${y}\" text-anchor=\"end\" dominant-baseline=\"central\">${esc(r.text)}<\/text><\/g>`;\n      }).join('');\n      const legend = `<g class=\"vz-l\"><circle cx=\"${lw + 5}\" cy=\"9\" r=\"5\" style=\"fill:var(--mark)\"/><text x=\"${lw + 16}\" y=\"9\" dominant-baseline=\"central\">${esc(o.aName)}<\/text>\n        <circle cx=\"${lw + 76}\" cy=\"9\" r=\"6\" style=\"fill:var(--mark-hi)\"/><text x=\"${lw + 88}\" y=\"9\" dominant-baseline=\"central\">${esc(o.bName)}<\/text><\/g>`;\n      return `<svg role=\"img\" aria-label=\"${esc(o.alt)}\" width=\"${w}\" height=\"${H}\" viewBox=\"0 0 ${w} ${H}\">${legend}${g}<\/svg>`;\n    });\n  }\n\n  /* series: {name, change, value (index), color}: one axis, indexed to 2024 = 100 */\n  function slope(el, o) {\n    const H = o.h || 300, top = 16, bot = 28, ph = H - top - bot;\n    const Y = v => top + ph - v / 200 * ph;\n    mount(el, w => {\n      const x1 = 12, rw = Math.min(o.rightW || 190, w * .68), x2 = w - rw - 14;\n      const g = o.series.map(s => `<g data-tip=\"${esc(`${s.name}: ${s.change} (2024 = 100, now ${Math.round(s.value)})`)}\">\n          <line class=\"vz-slope\" style=\"stroke:${s.color}\" x1=\"${x1}\" x2=\"${x2}\" y1=\"${Y(100)}\" y2=\"${Y(s.value)}\" pathLength=\"1\"/>\n          <circle class=\"vz-dot\" cx=\"${x2}\" cy=\"${Y(s.value)}\" r=\"6\" style=\"fill:${s.color}\"/>\n          <text x=\"${x2 + 14}\" y=\"${Y(s.value)}\" dominant-baseline=\"central\"><tspan class=\"vz-big\">${esc(s.change)}<\/tspan><tspan class=\"vz-l\" dx=\"7\">${esc(s.name)}<\/tspan><\/text><\/g>`).join('');\n      return `<svg role=\"img\" aria-label=\"${esc(o.alt)}\" width=\"${w}\" height=\"${H}\" viewBox=\"0 0 ${w} ${H}\">\n        <line class=\"vz-axis\" x1=\"${x1}\" x2=\"${x2}\" y1=\"${Y(100)}\" y2=\"${Y(100)}\"/>\n        <circle class=\"vz-dot\" cx=\"${x1}\" cy=\"${Y(100)}\" r=\"5\" style=\"fill:var(--muted)\"/>\n        ${g}\n        <text class=\"vz-l\" x=\"${x1 - 4}\" y=\"${H - 6}\">2024<\/text><text class=\"vz-l\" x=\"${x2}\" y=\"${H - 6}\" text-anchor=\"middle\">2025<\/text><\/svg>`;\n    });\n  }\n\n  /* segs: {label, value, color} */\n  function stack(el, o) {\n    const total = o.segs.reduce((s, x) => s + x.value, 0);\n    el.innerHTML = `<div class=\"vz-stack\" role=\"img\" aria-label=\"${esc(o.alt)}\" style=\"height:${o.h || 26}px\">${o.segs.map((s, i) => `<i data-tip=\"${esc(`${s.label}: ${fmt(s.value)} of ${fmt(total)}`)}\" style=\"flex:${s.value} 1 0;background:${s.color};--d:${i * 80}ms\"><\/i>`).join('')}<\/div>\n      <ul class=\"vz-legend\">${o.segs.map(s => `<li><i style=\"background:${s.color}\"><\/i><b>${fmt(s.value)}<\/b> ${esc(s.label)}<\/li>`).join('')}<\/ul>`;\n    el.classList.add('vz-anim');\n  }\n\n  function ledger(el) {\n    el.innerHTML = `<div class=\"vz-tablewrap\"><table class=\"vz-table\"><thead><tr><th>Measure<\/th><th>Value<\/th><th>Period<\/th><th>Source<\/th><\/tr><\/thead><tbody>${rows.map(r =>\n      `<tr><td>${esc(r.measure)}${r.category ? ` <span>· ${esc(r.category)}<\/span>` : ''}${r.methodology_notes ? `<small>${esc(r.methodology_notes)}<\/small>` : ''}<\/td><td class=\"nowrap\">${r.value_qualifier === 'lower-bound' ? '≥ ' : r.value_qualifier === 'approximate' ? '~' : ''}${Number(r.numeric_value).toLocaleString('en-PH')} ${esc(r.unit)}<\/td><td class=\"nowrap\">${esc(r.period)}<\/td><td><a href=\"${esc(r.source_url)}\" target=\"_blank\" rel=\"noopener\">${esc(r.source_name)}<\/a><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n  }\n\n  function exportCSV() {\n    const cols = Object.keys(rows[0]);\n    const q = v => `\"${String(v).replace(/\"/g, '\"\"')}\"`;\n    const csv = [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\\n');\n    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })), download: 'ph-online-scams-indicators.csv' });\n    a.click(); URL.revokeObjectURL(a.href);\n  }\n\n  /* Tooltip enhances direct labels; it never holds the only copy of a value. */\n  const tip = document.createElement('div'); tip.className = 'vz-tip'; tip.hidden = true;\n  addEventListener('DOMContentLoaded', () => document.body.append(tip));\n  addEventListener('mousemove', e => {\n    const t = e.target.closest && e.target.closest('[data-tip]');\n    if (!t) { tip.hidden = true; return; }\n    tip.textContent = t.dataset.tip; tip.hidden = false;\n    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';\n    tip.style.top = (e.clientY + 16) + 'px';\n  });\n\n  /* Chart specs shared by all options so numbers and framing never diverge. */\n  const charts = {\n    surge: (el, o = {}) => columns(el, { alt: 'CICC complaints: 3,317 in 2023, 10,004 in 2024, 18,633 in 2025', ...o,\n      rows: [2023, 2024, 2025].map(y => ({ label: String(y), value: V('cicc.complaints.' + y), text: fmt(V('cicc.complaints.' + y)), hi: y === 2025 })) }),\n    fraud: (el, o = {}) => hbars(el, { alt: 'CICC 2025 complaints by category, led by consumer fraud and online fraud', ...o, rows: [\n      ['Consumer fraud', 'cicc.consumerfraud.2025', 1], ['Online fraud', 'cicc.onlinefraud.2025', 1], ['Other', 'cicc.othercategories.2025', 0],\n      ['Harassment', 'cicc.harassment.2025', 0], ['Identity theft', 'cicc.identitytheft.2025', 0],\n    ].map(([label, id, hi]) => ({ label, value: V(id), text: fmt(V(id)), hi: !!hi })) }),\n    money: (el, o = {}) => hbars(el, { alt: '2024 reported losses by channel, led by GCash at 76.5 million pesos', ...o, rows: [\n      { label: 'GCash', value: V('cicc.losses.gcash.2024'), hi: true }, { label: 'Not named', value: D.unattributed },\n      { label: 'BPI', value: V('cicc.losses.bpi.2024') }, { label: 'GoTyme', value: V('cicc.losses.gotyme.2024') }, { label: 'Maya', value: V('cicc.losses.maya.2024') },\n    ].map(r => ({ ...r, text: peso(r.value) })) }),\n    police: (el, o = {}) => dumbbell(el, { alt: 'PNP-ACG recorded incidents fell in all four scam types between 2024 and 2025', aName: '2024', bName: '2025', ...o, rows: [\n      ['Online selling', 'onlineselling'], ['Investment / task', 'investment'], ['Hijacked profile', 'hijacked'], ['Vishing', 'vishing'],\n    ].map(([label, k]) => ({ label, a: V(`pnp.${k}.2024`), b: V(`pnp.${k}.2025`), text: pct(V(`pnp.${k}.2024`), V(`pnp.${k}.2025`), 0) })) }),\n    mediation: (el, c, o = {}) => stack(el, { alt: '2025 mediation caseload of 1,188: 409 successful, 144 failed, 323 terminated, 312 open', ...o, segs: [\n      { label: 'successful', value: V('bsp. hes the 2025 one.\"}, {\"observation_id\": \"pnp.vishing.2025\", \"measure\": \"PNP-ACG recorded vishing incidents\", \"numeric_value\": \"80\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"incidents\", \"period\": \"1 Jan – 4 Dec 2025\", \"geography\": \"Philippines\", \"category\": \"Vishing\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philippine National Police, Anti-Cybercrime Group\", \"source_url\": \"https://newsinfo.inquirer.net/2163702/fwd-pnp-logs-49-5-drop-in-online-selling-scams-from-jan-1-to-dec-4-2025\", \"source_date\": \"2026-01-06\", \"source_accessed\": \"\", \"source_kind\": \"official-statement\", \"methodology_notes\": \"A partial year: the window runs from 1 January to 4 December 2025, and the 2024 comparator covers the same dates.\"}, {\"observation_id\": \"bsp.complaints.2024\", \"measure\": \"New financial consumer complaints to the BSP Consumer Assistance Mechanism\", \"numeric_value\": \"70112\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"complaints\", \"period\": \"2024\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Complaints against BSP-supervised institutions — banks, e-money issuers and others. A redress mechanism, not a scam-reporting channel.\"}, {\"observation_id\": \"bsp.complaints.2025\", \"measure\": \"New financial consumer complaints to the BSP Consumer Assistance Mechanism\", \"numeric_value\": \"120000\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"lower-bound\", \"unit\": \"complaints\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Reported as \\\"more than 120,000 new complaints\\\". The numeric value is the stated floor, not an exact count, and no share should be computed against it.\"}, {\"observation_id\": \"bsp.complaints.growth.2025\", \"measure\": \"Growth in new BSP consumer complaints, as reported\", \"numeric_value\": \"72.6\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"percent\", \"period\": \"2024 → 2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"The BSP's own figure, published alongside the 70,112 comparator.\"}, {\"observation_id\": \"bsp.mediation.new.2024\", \"measure\": \"New mediation referrals\", \"numeric_value\": \"710\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2024\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.new.2025\", \"measure\": \"New mediation referrals\", \"numeric_value\": \"1057\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Reported as up 48.9% on 2024.\"}, {\"observation_id\": \"bsp.mediation.carryover.2025\", \"measure\": \"Mediation cases carried over from 2024\", \"numeric_value\": \"131\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"carried into 2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.handled.2025\", \"measure\": \"Mediation cases handled, including carryovers\", \"numeric_value\": \"1188\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"1,057 new referrals plus 131 carried over from 2024, as published.\"}, {\"observation_id\": \"bsp.mediation.completed.2025\", \"measure\": \"Mediation cases completed\", \"numeric_value\": \"876\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.successful.2025\", \"measure\": \"Mediations recorded as successful\", \"numeric_value\": \"409\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Successful\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"The BSP counts a mediation as successful either when the parties reach a settlement agreement or when they agree the matter has been sufficiently clarified and mutually terminate the proceedings as successful. This figure is therefore not a count of settlement agreements, and the BSP does not publish the split between the two outcomes.\"}, {\"observation_id\": \"bsp.mediation.failed.2025\", \"measure\": \"Mediations that failed to reach a successful outcome\", \"numeric_value\": \"144\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Failed\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.terminated.2025\", \"measure\": \"Mediations terminated for other reasons\", \"numeric_value\": \"323\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Terminated\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.successrate.2025\", \"measure\": \"Mediation success rate\", \"numeric_value\": \"74\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"rounded\", \"unit\": \"percent\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"The BSP's published rate. It equals 409 ÷ (409 + 144) = 74.0%: the 323 terminated cases are not in the denominator, and neither are the 312 cases still open at year end. \\\"Successful\\\" here carries the BSP's own meaning — a -complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.new.2025\", \"measure\": \"New adjudication cases\", \"numeric_value\": \"56\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"derived\", \"is_derived\": \"true\", \"derivation_inputs\": \"bsp.adjudication.handled.2025 bsp.adjudication.carryover.2025\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"The BSP published the total handled and the carryover but not the new-case count.\"}, {\"observation_id\": \"bsp.adjudication.decided.2025\", \"measure\": \"Adjudication cases decided\", \"numeric_value\": \"11\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Decided\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.dismissed.2025\", \"measure\": \"Adjudication cases dismissed\", \"numeric_value\": \"20\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"2025\", \"geography\": \"Philippines\", \"category\": \"Dismissed\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.adjudication.pending.2025\", \"measure\": \"Adjudication cases pending at year end\", \"numeric_value\": \"37\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"31 Dec 2025\", \"geography\": \"Philippines\", \"category\": \"Pending\", \"basis\": \"published\", \"is_derived\": \"false\", \"derivation_inputs\": \"\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"\"}, {\"observation_id\": \"bsp.mediation.open.2025\", \"measure\": \"Mediation cases still open at year end\", \"numeric_value\": \"312\", \"value_min\": \"\", \"value_max\": \"\", \"value_qualifier\": \"exact\", \"unit\": \"cases\", \"period\": \"31 Dec 2025\", \"geography\": \"Philippines\", \"category\": \"\", \"basis\": \"derived\", \"is_derived\": \"true\", \"derivation_inputs\": \"bsp.mediation.handled.2025 bsp.mediation.completed.2025\", \"source_name\": \"Philstar\", \"source_url\": \"https://www.philstar.com/business/2026/08/10/2548140/consumer-complaints-flood-central-bank-2025\", \"source_date\": \"2026-08-10\", \"source_accessed\": \"\", \"source_kind\": \"reporting-carrier\", \"methodology_notes\": \"Not published directly. It is the remainder of the handled caseload after the completed cases, and it is excluded from the published success rate.\"}];\n<\/script><script>/* Chart + data helpers shared by the three options. All figures come from data.js (generated from the CSV). */\n(function () {\n  const rows = window.SCAM_ROWS;\n  const by = Object.fromEntries(rows.map(r => [r.observation_id, r]));\n  const V = id => { if (!by[id]) throw new Error('Unknown id ' + id); return Number(by[id].numeric_value); };\n  const fmt = n => Math.round(n).toLocaleString('en-PH');\n  const pct = (from, to, d = 1) => { const p = (to / from - 1) * 100; return (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(d) + '%'; };\n  const peso = (n, d = 1) => '₱' + (n / 1e6).toFixed(d) + 'M';\n  const esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n  const named = ['gcash', 'bpi', 'gotyme', 'maya'].reduce((s, k) => s + V(`cicc.losses.${k}.2024`), 0);\n  const pnp = ['onlineselling', 'investment', 'hijacked', 'vishing'];\n  const D = {\n    mult: V('cicc.complaints.2025') / V('cicc.complaints.2023'),\n    fraud: V('cicc.consumerfraud.2025') + V('cicc.onlinefraud.2025'),\n    fraudShare: (V('cicc.consumerfraud.2025') + V('cicc.onlinefraud.2025')) / V('cicc.complaints.2025') * 100,\n    unattributed: V('cicc.losses.2024') - named,\n    pnp24: pnp.reduce((s, k) => s + V(`pnp.${k}.2024`), 0),\n    pnp25: pnp.reduce((s, k) => s + V(`pnp.${k}.2025`), 0),\n    strictRate: V('bsp.mediation.successful.2025') / V('bsp.mediation.completed.2025') * 100,\n  };\n\n  /* Re-renders on width change; animates on first paint only. */\n  function mount(el, draw) {\n    if (el._ro) el._ro.disconnect();\n    let last = 0;\n    const paint = first => {\n      const w = el.clientWidth; if (!w || w === last) return; last = w;\n      el.innerHTML = draw(w); el.classList.toggle('vz-anim', !!first);\n    };\n    paint(true);\n    el._ro = new ResizeObserver(() => paint(false)); el._ro.observe(el);\n  }\n\n  const barPath = (x, y, w, h, r = 4) => {\n    w = Math.max(w, 1); r = Math.min(r, w, h / 2);\n    return `M${x} ${y}h${w - r}a${r} ${r} 0 0 1 ${r} ${r}v${h - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${r - w}z`;\n  };\n  const colPath = (x, y, w, h, r = 4) => {\n    h = Math.max(h, 1); r = Math.min(r, h, w / 2);\n    return `M${x} ${y + h}v${r - h}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${h - r}z`;\n  };\n\n  /* rows: {label, value, text, hi, tip} */\n  function hbars(el, o) {\n    const rowH = o.rowH || 34, barH = o.barH || 16, H = o.rows.length * rowH;\n    const max = o.max || Math.max(...o.rows.map(r => r.value));\n    mount(el, w => {\n      const lw = o.labelW || Math.min(150, w * .36), vw = o.valueW || 86, pw = Math.max(40, w - lw - vw - 8);\n      const g = o.rows.map((r, i) => {\n        const y = i * rowH, by = y + (rowH - barH) / 2, bw = r.value / max * pw;\n        return `<g data-tip=\"${esc(r.tip || r.label + ': ' + r.text)}\"><rect x=\"0\" y=\"${y}\" width=\"${w}\" height=\"${rowH}\" fill=\"transparent\"/>\n          <text class=\"vz-l${r.hi ? ' vz-strong' : ''}\" x=\"${lw - 10}\" y=\"${y + rowH / 2}\" text-anchor=\"end\" dominant-baseline=\"central\">${esc(r.label)}<\/text>\n          <path class=\"vz-gx\" style=\"--d:${i * 60}ms;fill:${r.hi ? 'var(--mark-hi)' : 'var(--mark)'}\" d=\"${barPath(lw, by, bw, barH)}\"/>\n          <text class=\"vz-v${r.hi ? ' vz-strong' : ''}\" x=\"${lw + bw + 8}\" y=\"${y + rowH / 2}\" dominant-baseline=\"central\">${esc(r.text)}<\/text><\/g>`;\n      }).join('');\n      return `<svg role=\"img\" aria-label=\"${esc(o.alt)}\" width=\"${w}\" height=\"${H}\" viewBox=\"0 0 ${w} ${H}\">${g}<\/svg>`;\n    });\n  }\n\n  /* rows: {label, value, text, hi} */\n  function columns(el, o) {\n    const H = o.h || 200, top = 28, bot = 26, ph = H - top - bot, bm = o.barMax || 44;\n    const max = Math.max(...o.rows.map(r => r.value));\n    mount(el, w => {\n      const band = w / o.rows.length, bw = Math.min(bm, band * .55);\n      const g = o.rows.map((r, i) => {\n        const h = r.value / max * ph, x = band * i + (band - bw) / 2, y = top + ph - h;\n        return `<g data-tip=\"${esc(r.label + ': ' + r.text)}\"><rect x=\"${band * i}\" y=\"0\" width=\"${band}\" h
