<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Scams · Philippines</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;background:#0b0c0f;color:#f4f3ee}
header{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:8px 16px;flex-shrink:0;border-bottom:1px solid #2c2f35}
h1{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1 span{font-weight:400;color:#a3a7ad;letter-spacing:.02em;text-transform:none;margin-left:8px}
.seg{display:flex;background:#1c1e23;border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:#a3a7ad;padding:6px 14px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:#f4f3ee;color:#0b0c0f}
.seg button:focus-visible{outline:2px solid #ffc629;outline-offset:1px}
iframe{flex:1;width:100%;border:0;background:#0b0c0f}
@media(max-width:520px){h1 span{display:none}}
</style></head><body>
<header>
<nav class="seg" aria-label="View">
<button data-f="option-a-scroll-story.html">Story</button>
<button data-f="option-b-front-page.html">One page</button>
</nav></header>
<iframe title="Dashboard view" id="f"></iframe>
<script>const PAGES=__PAGES__;</script>
<script>
const bs=[...document.querySelectorAll('.seg button')],f=document.getElementById('f');
const pick=b=>{bs.forEach(x=>x.setAttribute('aria-pressed',x===b));f.srcdoc=PAGES[b.dataset.f];f.onload=()=>f.contentWindow.focus()};
bs.forEach(b=>b.onclick=()=>pick(b));pick(bs[0]);
</script></body></html>
